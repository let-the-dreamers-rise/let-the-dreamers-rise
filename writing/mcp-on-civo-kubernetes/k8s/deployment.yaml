apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-mcp
spec:
  replicas: 2
  selector:
    matchLabels: {app: warehouse-mcp}
  template:
    metadata:
      labels: {app: warehouse-mcp}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: server
          image: ghcr.io/YOUR_USER/warehouse-mcp:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: {name: warehouse-mcp}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-mcp
spec:
  selector: {app: warehouse-mcp}
  ports:
    - port: 80
      targetPort: 8000
